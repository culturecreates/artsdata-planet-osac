name: Fetch Performer and Exhibitions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 2 * *'

jobs:
  collect-urls:
    runs-on: ubuntu-latest
    outputs:
      performance-urls: ${{ steps.performance.outputs.urls }}
      exhibition-urls: ${{ steps.exhibition.outputs.urls }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Collect performance URLs
      id: performance
      run: echo "urls=$(bundle exec ruby src/main.rb performance)" >> $GITHUB_OUTPUT

    - name: Collect exhibition URLs
      id: exhibition
      run: echo "urls=$(bundle exec ruby src/main.rb exhibition)" >> $GITHUB_OUTPUT

  artsdata-push:
    runs-on: ubuntu-latest
    needs: collect-urls
    strategy:
      matrix:
        include:
          - artifact: performing-arts
            page-url: ${{ needs.collect-urls.outputs.performance-urls }}
            artifact-file: "outputs/performance.jsonld"
            custom-sparql: https://raw.githubusercontent.com/culturecreates/artsdata-planet-osac/main/sparql/fix_pa_image_urls.sparql
          - artifact: visual-media-arts
            artifact-file: "outputs/exhibition.jsonld"
            page-url: ${{ needs.collect-urls.outputs.exhibition-urls }}
            custom-sparql: ""
    steps:
    - name: Action setup
      uses: culturecreates/artsdata-pipeline-action@v4
      with:
        artifact: ${{ matrix.artifact }}
        mode: "fetch-push"
        publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
        page-url: ${{ matrix.page-url }}
        token: "${{ secrets.GITHUB_TOKEN }}"
        custom-sparql: ${{ matrix.custom-sparql }}
        urls-are-entities: 'true'